<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#faf6ef;--card:#ffffff;--border:#e8dfd3;--text:#5a5247;--muted:#9e9484;--accent:#7ec882;--accent2:#f4c542;--accent3:#e89898;--accent4:#7cb9e8;--accent5:#c4a6d8;--gradient1:linear-gradient(135deg,#7ec882,#4db8a4);--gradient2:linear-gradient(135deg,#f4c542,#e89898)}
body{font-family:'Hiragino Sans','Yu Gothic',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);line-height:1.6;padding:20px;max-width:1400px;margin:0 auto;background-image:radial-gradient(circle at 20% 80%,rgba(126,200,130,.06) 0%,transparent 50%),radial-gradient(circle at 80% 20%,rgba(244,197,66,.06) 0%,transparent 50%)}
h1{font-size:2.2rem;font-weight:800;color:#4db8a4;margin-bottom:4px}
.subtitle{color:var(--muted);font-size:.95rem;margin-bottom:32px}
.section{margin-bottom:40px}
.section-title{font-size:1.15rem;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px;color:#5a5247}
.section-title::before{content:'';width:4px;height:20px;background:var(--gradient1);border-radius:2px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:32px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;position:relative;overflow:hidden;box-shadow:0 2px 8px rgba(90,82,71,.06)}
.card .label{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.card .value{font-size:1.8rem;font-weight:800;color:#4a4238}
.card .sub{font-size:.78rem;color:var(--muted);margin-top:2px}
.card::after{content:'';position:absolute;top:0;right:0;width:60px;height:60px;border-radius:0 16px 0 40px;opacity:.12}
.card:nth-child(1)::after,.card:nth-child(5)::after{background:var(--accent)}
.card:nth-child(2)::after,.card:nth-child(6)::after{background:var(--accent2)}
.card:nth-child(3)::after,.card:nth-child(7)::after{background:var(--accent3)}
.card:nth-child(4)::after{background:var(--accent4)}
.charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.chart-box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:0 2px 8px rgba(90,82,71,.06)}
.chart-box h3{font-size:.9rem;font-weight:600;margin-bottom:12px;color:var(--muted)}
.chart-box canvas{width:100%!important;max-height:280px}
.full-width{grid-column:1/-1}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th{text-align:left;color:var(--muted);font-weight:600;font-size:.75rem;text-transform:uppercase;letter-spacing:.5px;padding:10px 12px;border-bottom:2px solid var(--border)}
td{padding:10px 12px;border-bottom:1px solid var(--border)}
tr:hover td{background:rgba(126,200,130,.06)}
.badge{display:inline-block;padding:2px 8px;border-radius:8px;font-size:.72rem;font-weight:600}
.badge-run{background:rgba(124,185,232,.2);color:#5a9ec7}
.badge-indoor{background:rgba(196,166,216,.2);color:#9b7fb8}
.badge-hike{background:rgba(126,200,130,.2);color:#5aa65e}
.badge-climb{background:rgba(244,197,66,.2);color:#c9a030}
.badge-strength{background:rgba(232,152,152,.2);color:#c07070}
.pace-bar{height:6px;border-radius:3px;background:var(--border);position:relative;overflow:hidden}
.pace-bar-fill{height:100%;border-radius:3px;background:var(--gradient1)}
@media(max-width:768px){.charts-grid{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,1fr)}body{padding:12px}h1{font-size:1.6rem}.card .value{font-size:1.4rem}}
</style>
</head>

// ── Summary Stats ──
const totalDist = runs.reduce((s,a)=>s+a.dist,0);
const totalCal = runs.reduce((s,a)=>s+a.cal,0);
const runHRs = runs.filter(a=>a.hr).map(a=>a.hr);
const avgHR = Math.round(runHRs.reduce((s,v)=>s+v,0)/runHRs.length);

function parsePaceSec(p){if(!p)return null;const[m,s]=p.split(':').map(Number);return m*60+s}
const paces=runs.map(a=>parsePaceSec(a.pace)).filter(Boolean);
const avgPaceSec=Math.round(paces.reduce((s,v)=>s+v,0)/paces.length);
const avgPaceStr=`${Math.floor(avgPaceSec/60)}:${String(avgPaceSec%60).padStart(2,'0')}`;

function parseDurMin(d){const parts=d.split(':').map(Number);if(parts.length===3)return parts[0]*60+parts[1]+parts[2]/60;return parts[0]+parts[1]/60}
const totalMin=runs.reduce((s,a)=>s+parseDurMin(a.dur),0);
const totalHrs=Math.floor(totalMin/60);
const remainMin=Math.round(totalMin%60);

const maxDist=longestRun.dist;
const maxDistDate=longestRun.date;

  const ps=parsePaceSec(a.pace);if(ps){months[m].paceSum+=ps;months[m].paceCount++}
