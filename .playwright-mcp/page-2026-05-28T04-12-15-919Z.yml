    - generic [ref=e308]:
      - heading "AI 教练建议" [level=4] [ref=e309]
      - paragraph [ref=e310]: 当前处于首马3:30准备的早期阶段（28周），核心任务是建立强大的有氧基础，而非追求配速。你的VO2max（52）和阈值配速（4:37）具备3:30潜力，但近期训练暴露出有氧效率不足：12km配速5:29时心率已达158，轻松跑掉速严重，HRV偏低。未来4周请严格执行80/20强度分布：80%跑量心率<137（配速约6:10-6:40），20%为节奏跑（5:10-5:20）或间歇。周跑量从本周30-35km逐步增至45km，每3周减量1周。步频目标180spm以上，减少触地时间降低受伤风险。密切关注HRV，若连续2天低于55则额外休息。马拉松配速4:58/km目前不应在训练中频繁使用，待有氧基础稳固后（8-10周后）再逐步引入。保持耐心，基础期决定比赛成败。