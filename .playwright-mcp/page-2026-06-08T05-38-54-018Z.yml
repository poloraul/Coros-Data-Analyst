      - paragraph [ref=e329]: 当前处于26周准备的准备期，有氧底子优良但需要注意湿热环境引发的隐性疲劳。本周计划总跑量约49公里，达到基础跑量目标。核心原则：降低高强度占比，增加轻松跑比例至80%，严格按心率分区执行。重点关注HRV恢复趋势，若连续3天HRV低于正常下限，需减少训练量或插入被动恢复日。训练中持续练习匀速控制，降低配速波动。湿热天的长距离务必重视补水和降温，可规划清晨完成。心理建设上，首马3:30完全可行，按4:58目标配速训练尚需耐心积累有氧耐力，勿过早强度冒进。每周至少1次马拉松配速专项感知训练将在后期加入。加油！