        - heading "训练概要" [level=4] [ref=e77]
        - paragraph [ref=e78]: 高强度10公里跑，配速5:30，在极度湿热条件下完成，表现一般，心率变化异常，强度超标。
        - generic [ref=e79]: 本次训练距离10.09公里，平均配速5:30，呈负分段加速(5:57→5:16)，速度控制较好，但CV达7.8%（fair）。心率从147异常下降至132，漂移-10.2%，可能与开始时热身不足或数据波动有关。心率区间分布中Z5占比高达58%，说明训练强度过大，已远超有氧区间，属高强度间歇或阈值以上训练。天气极其湿热（温度33.4℃，体感36.5℃，湿度96%），高温高湿使其实际生理负荷进一步放大。在本该建立有氧基础的准备期，此类训练不仅难以提升有氧效率，还大幅增加恢复需求和受伤风险。
      - generic [ref=e80]:
        - heading "亮点" [level=4] [ref=e81]
        - generic [ref=e82]: 负分段加速显示良好的跑步节奏感和最后阶段的提速能力
        - generic [ref=e83]: 步频178，其中>180占比64%，步频较高有利于跑步经济性
        - heading "改进方向" [level=4] [ref=e84]
        - generic [ref=e85]: 准备期应以有氧轻松跑为主，控制心率在Z1-Z2（<147），当前配速应放慢至5:50-6:20/km
        - generic [ref=e86]: 在高温高湿环境下，主动降低强度，配速可比目标轻松跑慢15-30秒，优先看心率而非配速
        - generic [ref=e87]: 减少Z4、Z5区间跑量，将高强度训练控制在每周不超过一次，且远离极端天气
