      - paragraph [ref=e332]: 目前你处于首马准备的准备期，核心任务是建立扎实的有氧基础，而不是提升速度。近期的训练展现了良好的控速能力和速度储备，但高强度占比明显过高，长期如此可能让你的有氧引擎发展滞后，也会增加受伤风险。接下来请把轻松跑（配速5:50-6:30/km）和LSD作为主要内容，占周跑量的80%以上。严格将心率控制在Z1-Z2，尤其在高温高湿天气，不要硬顶配速。每周仅安排一次节奏跑或间歇，保持速度感觉即可。关注你的HRV，若持续偏低，及时增加休息日。你当前身体状态还不错，只要耐心打磨有氧基础，3:30的首马目标是完全可行的。坚持执行，你会感受到有氧效率的明显提升。