<!DOCTYPE html>
<html lang="zh-CN" data-vp="md">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日训练复盘 · 索引</title><style>
:root{--bg:#12171A;--paper:#171D21;--ink:#E7EDEA;--ink2:#9BA9A5;--ink3:#647470;
--line:#283034;--line2:#1E2529;--rowbg:#16302B;--accent:#2BC4AE;--alt:#F0A03C;--seg1:#3A464B;
--mono:"SF Mono","JetBrains Mono","Menlo",ui-monospace,monospace;
--sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.65;-webkit-font-smoothing:antialiased}
.wrap{margin:0 auto;padding:0 20px 72px}
html[data-vp="sm"] .wrap{max-width:600px}
html[data-vp="md"] .wrap{max-width:960px}
html[data-vp="xl"] .wrap{max-width:1560px}
.page{display:block}.rail{display:contents}
.head{padding-top:26px}
.bar{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);
font-family:var(--mono);font-size:11px;color:var(--ink3);letter-spacing:.3px;flex-wrap:wrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none}
.bar .r{margin-left:auto;display:flex;gap:14px}
h1{font-size:24px;font-weight:500;letter-spacing:-.4px;margin:18px 0 4px;line-height:1.3}
.lede{color:var(--ink2);font-size:13.5px;margin:0;max-width:680px}
.lede b{font-weight:500;color:var(--ink)}
.lede em{font-style:normal;color:var(--accent);font-weight:500}
.lede i{font-style:normal;color:var(--alt);font-weight:500}
.kpi{display:grid;grid-template-columns:repeat(4,1fr);margin:22px 0 0;
border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.kpi>div{padding:15px 0 14px 18px;border-left:1px solid var(--line)}
.kpi>div:first-child{border-left:0;padding-left:0}
.kpi .l{font-size:10.5px;color:var(--ink3);letter-spacing:.4px;font-family:var(--mono)}
.kpi .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:26px;line-height:1.25;margin-top:2px;letter-spacing:-1px;color:var(--ink)}
.kpi .s{font-size:11px;color:var(--ink3);font-family:var(--mono)}
.kpi .s.g{color:var(--accent)}
.m2,.m3{display:none}
.load{margin:20px 0 0}
.load .h{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10.5px;color:var(--ink3);margin-bottom:6px;letter-spacing:.3px}
.track{display:flex;height:9px;border-radius:2px;overflow:hidden;background:var(--line2)}
.track i{display:block;height:100%}
.legend{display:flex;gap:12px;margin-top:7px;font-family:var(--mono);font-size:10.5px;color:var(--ink2);flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:5px}
.legend em{width:8px;height:8px;border-radius:1px;display:block}
.mini{display:none;margin-top:22px;border-top:1px solid var(--line);padding-top:14px}
.mini .h{font-family:var(--mono);font-size:10.5px;color:var(--ink3);letter-spacing:.4px;margin-bottom:8px}
.mini .it{display:flex;align-items:baseline;gap:8px;padding:5px 0;border-bottom:1px solid var(--line2);font-size:12px}
.mini .it .k{color:var(--ink2);flex:1}
.mini .it .v{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink)}
.mini .it .v.ok{color:var(--accent)}.mini .it .v.wn{color:var(--alt)}
.xcmp{display:none;margin-top:26px;border-top:1px solid var(--line);padding-top:14px}
.xcmp .h{font-family:var(--mono);font-size:10.5px;color:var(--ink3);letter-spacing:.4px;margin-bottom:8px;display:flex;justify-content:space-between}
.xcmp .it{display:flex;align-items:baseline;gap:8px;padding:6px 0;border-bottom:1px solid var(--line2);font-size:12px}
.xcmp .it .k{color:var(--ink2);flex:1}
.xcmp .it .a{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink3)}
.xcmp .it .b{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink);min-width:44px;text-align:right}
.xcmp .it .d{font-family:var(--mono);font-size:11px;color:var(--accent);min-width:46px;text-align:right}
.xcmp .it .d.up{color:var(--alt)}
h2{font-size:12.5px;font-weight:500;letter-spacing:.2px;margin:30px 0 0;padding-bottom:7px;
border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;color:var(--ink)}
h2 .tag{font-family:var(--mono);font-size:10px;color:var(--ink3);font-weight:400;margin-left:auto;letter-spacing:.5px}
table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:2px}
th{font-family:var(--mono);font-size:10px;font-weight:400;color:var(--ink3);letter-spacing:.5px;
text-align:right;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child{text-align:left;padding-left:0}
td{text-align:right;padding:8px 10px;border-bottom:1px solid var(--line2);
font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink);white-space:nowrap}
td:first-child{text-align:left;padding-left:0;font-family:var(--sans);color:var(--ink2)}
tr.hl td{background:var(--rowbg)}tr.hl td:first-child{color:var(--accent);font-weight:500}
tr.anom td{color:var(--alt)}tr.anom td:first-child{color:var(--alt)}
tr.sum td{border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--line2)}
tr.sum td:first-child{color:var(--ink);font-weight:500}
tr:last-child td{border-bottom:1px solid var(--line)}
.md-up,.xl-up{display:none}
.note-s{color:var(--ink3);font-size:10.5px;font-family:var(--mono);margin-top:10px;line-height:1.8}
.figbox{height:220px;margin-top:14px}
.notes{margin-top:26px}
.notes>div{display:grid;grid-template-columns:26px 1fr;gap:10px;padding:11px 0;
border-bottom:1px solid var(--line2);font-size:13.5px;color:var(--ink2);line-height:1.6}
.notes>div:last-child{border-bottom:0}
.notes .i{font-family:var(--mono);font-size:11px;color:var(--accent);padding-top:3px;letter-spacing:.3px}
.notes b{font-weight:500;color:var(--ink)}
.call{margin-top:18px;padding:12px 14px;border-left:2px solid var(--alt);
background:rgba(240,160,60,.07);font-size:12.5px;color:var(--ink2);line-height:1.65}
.call b{color:var(--alt);font-weight:500}
.call.g{border-left-color:var(--accent);background:rgba(43,196,174,.07)}
.call.g b{color:var(--accent)}
.foot{margin-top:32px;padding-top:12px;border-top:1px solid var(--line);
font-family:var(--mono);font-size:10.5px;color:var(--ink3);line-height:1.9;letter-spacing:.2px}
.flag{display:inline-block;font-family:var(--mono);font-size:10px;padding:1px 7px;border-radius:3px;
background:var(--rowbg);color:var(--accent);border:1px solid var(--line);letter-spacing:.3px}
html[data-vp="sm"] body{font-size:13px}
html[data-vp="sm"] h1{font-size:20px}
html[data-vp="sm"] .kpi{grid-template-columns:1fr 1fr}
html[data-vp="sm"] .kpi>div:nth-child(odd){border-left:0;padding-left:0}
html[data-vp="sm"] .kpi>div:nth-child(n+3){border-top:1px solid var(--line)}
html[data-vp="sm"] .kpi .v{font-size:22px}
html[data-vp="sm"] th,html[data-vp="sm"] td{padding:7px 6px;font-size:11.5px}
html[data-vp="sm"] .figbox{height:180px}
html[data-vp="md"] .kpi{grid-template-columns:repeat(4,1fr)}
html[data-vp="md"] .md-up{display:table-cell}
html[data-vp="md"] .kpi .m2{display:block}
html[data-vp="md"] .mini{display:block}
html[data-vp="xl"] .page{display:grid;grid-template-columns:252px minmax(0,1fr) 372px;
grid-template-areas:"head head aside" "rail tbl aside" "rail fig aside" "foot foot foot";
column-gap:36px;align-items:start}
html[data-vp="xl"] .head{grid-area:head;padding-top:28px}
html[data-vp="xl"] .rail{display:block;grid-area:rail;padding-top:28px}
html[data-vp="xl"] .tbl{grid-area:tbl;padding-top:28px}
html[data-vp="xl"] .fig{grid-area:fig}
html[data-vp="xl"] .aside{grid-area:aside;padding-top:28px;border-left:1px solid var(--line);padding-left:32px}
html[data-vp="xl"] .foot{grid-area:foot}
html[data-vp="xl"] h1{font-size:29px;letter-spacing:-.7px;margin-top:16px}
html[data-vp="xl"] .lede{max-width:700px;font-size:14px}
html[data-vp="xl"] .kpi{grid-template-columns:1fr;margin-top:20px;border-bottom:0;border-top:1px solid var(--line)}
html[data-vp="xl"] .kpi>div{border-left:0;padding:13px 0;border-bottom:1px solid var(--line2);display:flex;align-items:baseline;gap:10px}
html[data-vp="xl"] .kpi>div:first-child{padding-left:0}
html[data-vp="xl"] .kpi .l{flex:none;width:74px;white-space:nowrap}
html[data-vp="xl"] .kpi .v{font-size:21px;margin-top:0;flex:none}
html[data-vp="xl"] .kpi .s{margin-left:auto;text-align:right}
html[data-vp="xl"] .m2,html[data-vp="xl"] .m3{display:flex}
html[data-vp="xl"] .mini{display:block}
html[data-vp="xl"] .xcmp{display:block}
html[data-vp="xl"] .md-up,html[data-vp="xl"] .xl-up{display:table-cell}
html[data-vp="xl"] .figbox{height:286px}
html[data-vp="xl"] .notes{margin-top:0}
html[data-vp="xl"] .notes>div{grid-template-columns:22px 1fr;font-size:13px}
html[data-vp="xl"] h2{margin-top:0}
html[data-vp="xl"] .fig h2{margin-top:28px}
@media print{
:root{--bg:#fff;--paper:#fff;--ink:#111827;--ink2:#4B5563;--ink3:#9CA3AF;--line:#E5E7EB;
--line2:#F3F4F6;--rowbg:#EFFAF7;--accent:#0E9488;--alt:#B45309;--seg1:#CBD5E1}
.page{display:block!important}.rail{display:contents}.figbox{height:250px}
body{font-size:11px}.head{padding-top:0}}

td a{color:var(--accent);text-decoration:none;font-family:var(--mono);
font-variant-numeric:tabular-nums;border-bottom:1px solid transparent}
td a:hover{border-bottom-color:var(--accent)}
tr.hl td a{font-weight:500}
</style></head>
