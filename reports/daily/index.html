<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日训练复盘 · 索引</title>
<style>/* ============================================================
   WorkBuddy 默认 HTML 报告样式 · 暖纸旅行志
   Warm-paper editorial style  ·  v1.0  ·  2026-11-22

   出处：用户指定参考 https://poloraul.github.io/web-pages/along-the-monsoon/
   定位：所有由 WorkBuddy 生成的 HTML 报告/看板/复盘的默认视觉语言。
   原则：浅色暖纸底 + 玻璃拟态卡片 + 朱红/蜜黄/靛蓝三色语义 + 大圆角 + 柔和投影。
        禁止深色底、禁止霓虹色、禁止硬阴影、禁止纯黑文字。

   用法：<style> 里整段引入本文件内容，或 <link rel="stylesheet" href="...">
   ============================================================ */

:root{
  /* 文字与线 */
  --ink:#2b2722;        /* 主文字·墨棕 */
  --ink2:#6b6355;       /* 次文字 */
  --ink3:#9a8f7c;       /* 弱文字·说明 */
  --line:#ddd5c6;       /* 分割线 */
  --line2:#ece6da;      /* 浅分割线 */

  /* 语义色 */
  --blood:#b03a2e;      /* 朱红·强调 / 警示 / 最新 / 超限 */
  --honey:#d99a2b;      /* 蜜黄·标记 / 分类 / 次级强调 */
  --blue:#2f6f9f;       /* 靛蓝·对比 / 正常 / 基准 */

  /* 面 */
  --card:rgba(255,255,255,.66);
  --card2:rgba(255,255,255,.82);

  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans SC",sans-serif;
  --mono:"SF Mono","JetBrains Mono","Menlo",ui-monospace,monospace;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}

/* ── 页面底色：三层渐变，暖橙 + 冷蓝 + 米白 ── */
body{
  font-family:var(--sans);
  color:var(--ink);
  background:
    radial-gradient(1200px 700px at 8% -10%, #fdece0 0%, rgba(253,236,224,0) 60%),
    radial-gradient(1000px 700px at 100% 0%, #e6eef7 0%, rgba(230,238,247,0) 55%),
    linear-gradient(160deg,#fbf8f2 0%,#f4f1ea 45%,#eef0f2 100%);
  background-attachment:fixed;
  min-height:100vh;
  padding:34px 30px 46px;
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1360px;margin:0 auto}

/* ── 页头 ── */
header{margin-bottom:22px}
.kicker{font-size:12.5px;letter-spacing:.32em;color:var(--blood);font-weight:600}
.kicker span{color:var(--ink3);letter-spacing:.18em;font-weight:500}
h1{margin:8px 0 6px;font-size:34px;line-height:1.2;letter-spacing:.01em;font-weight:700}
h1 small{display:block;font-size:15px;font-weight:400;color:var(--ink2);letter-spacing:.02em;margin-top:8px}
h2{font-size:19px;font-weight:700;margin:26px 0 10px;letter-spacing:.01em}
h3{font-size:14px;font-weight:700;margin:20px 0 8px;letter-spacing:.02em}

/* ── 胶囊指标行 ── */
.stats{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.stat{
  background:var(--card);border:1px solid rgba(255,255,255,.7);
  box-shadow:0 6px 18px rgba(60,45,25,.07);backdrop-filter:blur(14px);
  border-radius:12px;padding:8px 14px;font-size:12.5px;color:var(--ink2)
}
.stat b{color:var(--ink);font-size:16px;margin-right:4px;font-variant-numeric:tabular-nums}
.stat.warn b{color:var(--blood)}
.stat.good b{color:var(--blue)}

/* ── 卡片与栅格 ── */
.grid{display:grid;grid-template-columns:minmax(0,1.62fr) minmax(330px,1fr);gap:22px;margin-top:22px;align-items:start}
.grid.even{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid.thirds{grid-template-columns:repeat(3,minmax(0,1fr))}
.col{display:flex;flex-direction:column;gap:22px;min-width:0}
.card{
  background:var(--card);border:1px solid rgba(255,255,255,.72);
  backdrop-filter:blur(16px);border-radius:20px;
  box-shadow:0 14px 40px rgba(60,45,25,.10);overflow:hidden
}
.card>.hd{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 20px 9px}
.card>.hd .t{font-size:12px;letter-spacing:.22em;color:var(--ink2);font-weight:600}
.card>.hd .x{font-size:11px;letter-spacing:.14em;color:var(--ink3)}
.card>.bd{padding:0 20px 18px}
.card>.bd.tight{padding:0 8px 10px}

/* ── 表格 ── */
table{width:100%;border-collapse:collapse;font-size:13px}
th{
  font-size:10.5px;font-weight:600;color:var(--ink3);letter-spacing:.12em;
  text-align:right;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap
}
th:first-child{text-align:left;padding-left:4px}
td{
  padding:8px 10px;border-bottom:1px solid var(--line2);text-align:right;
  color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap
}
td:first-child{text-align:left;padding-left:4px;color:var(--ink2)}
tbody tr:last-child td{border-bottom:0}
tr.hl td{background:rgba(217,154,43,.13)}
tr.hl td:first-child{color:var(--blood);font-weight:700}
tr.anom td,tr.anom td:first-child{color:var(--blood)}
tr.anom td:first-child{font-weight:600}
tr.sum td{background:rgba(43,39,34,.045);border-top:1px solid var(--line);font-weight:700}
tr.sum td:first-child{color:var(--ink)}
.note-s{font-size:11.5px;line-height:1.8;color:var(--ink3);margin-top:10px}
.note-s b{color:var(--blood)}

/* ── 键值行 ── */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  padding:7px 0;border-bottom:1px dashed var(--line2);font-size:13px}
.row:last-child{border-bottom:0}
.row .k{color:var(--ink2)}
.row .v{font-variant-numeric:tabular-nums;color:var(--ink);font-weight:700;white-space:nowrap}
.row .v.ok{color:var(--blue)}
.row .v.wn{color:var(--blood)}

/* ── 比例条（分布 / 进度 / 占比） ── */
.bar{display:flex;height:10px;border-radius:6px;overflow:hidden;background:var(--line2);margin:2px 0 10px}
.bar i{display:block;height:100%}
.bartags{display:flex;flex-wrap:wrap;gap:8px}
.bartags span{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink2)}
.bartags em{width:9px;height:9px;border-radius:50%;display:block;flex:none}
/* 兼容旧类名 */
.bandbar{display:flex;height:10px;border-radius:6px;overflow:hidden;background:var(--line2);margin:2px 0 10px}
.bandbar i{display:block;height:100%}
.bandtags{display:flex;flex-wrap:wrap;gap:8px}
.bandtags span{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink2)}
.bandtags em{width:9px;height:9px;border-radius:50%;display:block;flex:none}

/* ── 编号要点（判读 / 结论 / 清单） ── */
.notes{display:flex;flex-direction:column;gap:0}
.note{display:grid;grid-template-columns:26px 1fr;gap:12px;padding:13px 0;border-bottom:1px dashed var(--line2)}
.note:last-child{border-bottom:0;padding-bottom:2px}
.note .no{
  width:24px;height:24px;border-radius:50%;background:#fff;border:2px solid var(--honey);
  display:flex;align-items:center;justify-content:center;
  font-size:11.5px;font-weight:700;color:#3a332a;line-height:1
}
.note.hot .no{border-color:var(--blood);color:var(--blood)}
.note h4{margin:0 0 3px;font-size:14px;font-weight:700;color:var(--ink);letter-spacing:.01em}
.note p{margin:0;font-size:13.4px;line-height:1.78;color:#4a4235}
.note b{color:var(--blood);font-weight:700}

/* ── 结论 / 引文 ── */
.concl,.quote{
  margin:0;padding:11px 14px;border-left:3px solid var(--blood);
  background:rgba(176,58,46,.06);border-radius:0 12px 12px 0;
  font-size:13.4px;line-height:1.75;color:#5a5044
}
.concl b,.quote b{color:var(--blood)}
.concl.good{border-left-color:var(--blue);background:rgba(47,111,159,.07)}
.concl.good b{color:var(--blue)}

/* ── 标签胶囊 ── */
.pill{display:inline-block;font-size:11px;letter-spacing:.06em;color:#fff;
  background:var(--honey);border-radius:999px;padding:2px 10px;margin-left:8px;vertical-align:2px}
.pill.blood{background:var(--blood)}
.pill.blue{background:var(--blue)}

/* ── 图表容器 ── */
.figbox{height:300px;margin-top:4px}
.figbox.sm{height:230px}
.figbox.lg{height:400px}

/* ── 页脚 ── */
footer{max-width:1360px;margin:22px auto 0;font-size:12px;line-height:1.85;color:#8a8172}
footer b{color:#6b6355}
footer .sig{display:inline-block;font-size:10.5px;letter-spacing:.14em;color:var(--blood);
  border:1px solid rgba(176,58,46,.32);border-radius:999px;padding:1px 9px;margin-right:4px}

/* ── 索引/列表页 ── */
.idx-table td a{color:var(--blood);text-decoration:none;font-weight:600;
  border-bottom:1px solid rgba(176,58,46,.28)}
.idx-table td a:hover{border-bottom-color:var(--blood)}
.idx-table td{padding:11px 10px}

/* ── 响应式 ── */
@media (max-width:1100px){
  .grid,.grid.even,.grid.thirds{grid-template-columns:1fr}
}
@media (max-width:720px){
  body{padding:24px 16px 34px}
  h1{font-size:25px}
  h1 small{font-size:13.5px}
  .card>.bd{padding:0 14px 16px}
  .card>.hd{padding:13px 14px 8px}
  table{font-size:12px}
  td,th{padding:7px 6px}
  .figbox{height:220px}
  .figbox.sm{height:190px}
  .figbox.lg{height:260px}
  .stat{padding:7px 11px;font-size:12px}
  .stat b{font-size:14.5px}
}

/* ── 打印：去投影、去毛玻璃，省墨存档 ── */
@media print{
  body{background:#fff;padding:0}
  .card{box-shadow:none;border:1px solid var(--line);backdrop-filter:none;background:#fff}
  .stat{box-shadow:none;backdrop-filter:none;background:#fff}
  .grid,.grid.even,.grid.thirds{grid-template-columns:1fr}
  .figbox{height:220px}
}

/* ── Chart.js 配色约定（写在报告脚本里，此处仅备忘） ─────────────
   主序列（重要/涨/强调）：#b03a2e   次序列（对比/基准）：#2f6f9f
   第三序列（分类/标记）：  #d99a2b   中性/空白：        #cfc6b4 / #e4ded1
   网格线：rgba(43,39,34,.09)   轴文字：#9a8f7c
   折线填充：同色 rgba(x,.07~.10)
   tooltip：背景 #2b2722，文字 #fbf8f2，圆角 8px，padding 9px
   ─────────────────────────────────────────────────────────── */
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="kicker">TRAINING LOG <span>· 每日自动复盘</span></div>
    <h1>每日训练复盘<small>每天 10:00 检查前一日训练记录，有活动即生成复盘报告。最新一期在列表首行。</small></h1>
    <div class="stats"><span class="stat"><b>2</b>期报告</span>
      <span class="stat"><b>2026-11-19</b>最近更新</span></div>
  </header>
  <section class="card" style="margin-top:22px">
    <div class="hd"><span class="t">全部报告</span><span class="x">REPORTS</span></div>
    <div class="bd">
      <table class="idx-table">
        <thead><tr><th>日期</th><th>距离 km</th><th>负荷 TL</th><th>强度</th></tr></thead>
        <tbody><tr class="hl"><td><a href="20261122.html">2026-11-22</a></td><td>12.40</td><td>137</td><td>E</td></tr><tr><td><a href="20261119.html">2026-11-19</a></td><td>6.59</td><td>49</td><td>E</td></tr></tbody>
      </table>
      <div class="note-s">按日期倒序 · 点击日期打开对应复盘</div>
    </div>
  </section>
  <footer>数据源 COROS APEX 4 · 自动生成 · 暖纸旅行志版式<br>
    <span class="sig">AUTO REVIEW</span> 每日 10:00 运行 · 推送至 GitHub Pages</footer>
</div>
</body>
</html>
